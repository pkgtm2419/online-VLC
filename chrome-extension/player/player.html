<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PVP Player</title>
  <link rel="stylesheet" href="player.css">
  <script src="hls.min.js"></script>
</head>
<body>
  <div class="vlc-window" id="vlcWindow">
    <!-- Top Header -->
    <header class="vlc-menubar">
      <div class="menubar-left">
        <div class="vlc-logo-icon">
          <svg viewBox="0 0 100 100" width="18" height="18">
            <path d="M50 5 L35 75 L65 75 Z" fill="#ff7f00" stroke="#cc6600" stroke-width="2"/>
            <path d="M42 30 L38 48 L62 48 L58 30 Z" fill="#ffffff"/>
            <path d="M38 52 L35 70 L65 70 L62 52 Z" fill="#ffffff"/>
            <path d="M25 75 L75 75 L80 90 L20 90 Z" fill="#e65100"/>
            <ellipse cx="50" cy="90" rx="35" ry="5" fill="#cc4400"/>
          </svg>
          <span>PVP Player</span>
        </div>
        <button id="btnOpenStream" class="menubar-direct-btn">🌐 Open URL</button>
        <button id="btnPastePlay" class="menubar-direct-btn">📋 Paste & Play</button>
      </div>
      <div class="menubar-title" id="videoTitle">Personal Video Player</div>
    </header>

    <!-- Video Display Area -->
    <main class="vlc-display-area" id="displayArea">
      <!-- OSD Notification -->
      <div id="vlcOsd" class="vlc-osd">Volume: 100%</div>

      <!-- HTML5 Video Player -->
      <video id="videoPlayer" class="vlc-video-element hidden" playsinline></video>

      <!-- Embed Frame (YouTube / Vimeo fallback) -->
      <iframe id="embedFrame" class="vlc-embed-frame hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>

      <!-- Idle Cone Screen -->
      <div class="vlc-cone-screen" id="coneScreen">
        <div class="cone-wrapper">
          <svg viewBox="0 0 100 100" width="120" height="120">
            <path d="M50 5 L35 75 L65 75 Z" fill="#ff7f00" stroke="#cc6600" stroke-width="2"/>
            <path d="M42 30 L38 48 L62 48 L58 30 Z" fill="#ffffff"/>
            <path d="M38 52 L35 70 L65 70 L62 52 Z" fill="#ffffff"/>
            <path d="M25 75 L75 75 L80 90 L20 90 Z" fill="#e65100"/>
            <ellipse cx="50" cy="90" rx="35" ry="5" fill="#cc4400"/>
          </svg>
        </div>
        <h2 class="cone-title">PVP Media Player</h2>
        <p class="cone-subtitle">100% Standalone In-Browser VLC Video Player</p>
        <div class="cone-actions-row">
          <button id="btnQuickPastePlay" class="btn-primary-vlc">
            <span>📋 Paste & Play from Clipboard</span>
          </button>
          <button id="btnQuickOpen" class="btn-secondary-vlc">
            <span>🌐 Open Network Stream...</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Controls Panel -->
    <footer class="vlc-controls-panel">
      <!-- Timeline Row -->
      <div class="controls-timeline-row">
        <span class="time-display" id="currentTime">00:00:00</span>
        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="100" value="0" step="0.1">
        <span class="time-display" id="totalTime">00:00:00</span>
      </div>

      <!-- Buttons Row -->
      <div class="controls-buttons-row">
        <div class="buttons-left">
          <button id="btnPlayPause" class="ctrl-btn" title="Play/Pause (Space)">▶</button>
          <button id="btnStop" class="ctrl-btn" title="Stop (S)">⏹</button>
          <button id="btnRewind10" class="ctrl-btn" title="Rewind 10s (←)">⟲</button>
          <button id="btnForward10" class="ctrl-btn" title="Forward 10s (→)">⟳</button>
          <div class="volume-row">
            <button id="btnMute" class="ctrl-btn" title="Mute (M)">🔊</button>
            <input type="range" id="volSlider" class="vol-slider" min="0" max="125" value="100" title="Volume (up to 125%)">
            <span id="volText" style="font-size: 11px; min-width: 32px; color: #aaa;">100%</span>
          </div>
        </div>

        <div class="buttons-right">
          <button id="btnSlower" class="ctrl-btn" title="Slower ([)">&minus;</button>
          <span id="speedDisplay" class="speed-badge">1.00x</span>
          <button id="btnFaster" class="ctrl-btn" title="Faster (])">&plus;</button>
          <button id="btnFullscreen" class="ctrl-btn" title="Fullscreen (F)">⛶</button>
        </div>
      </div>
    </footer>

    <!-- Open URL Modal -->
    <div id="urlModal" class="vlc-modal-backdrop hidden">
      <div class="vlc-modal">
        <div class="vlc-modal-header">
          <h3>🌐 Open Network Stream</h3>
          <button id="btnModalClose" class="modal-close-btn">&times;</button>
        </div>
        <div class="vlc-modal-body">
          <p style="font-size: 13px; color: #ccc;">Enter any video URL (YouTube, Vimeo, HLS .m3u8, direct .mp4, etc.):</p>
          <input type="url" id="urlInput" placeholder="https://..." autofocus>
        </div>
        <div class="vlc-modal-footer">
          <button id="btnModalCancel" class="btn-secondary-vlc">Cancel</button>
          <button id="btnModalSubmit" class="btn-primary-vlc">▶ Stream</button>
        </div>
      </div>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
