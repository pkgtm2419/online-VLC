<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-row">
        <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 90 L50 10 L80 90 Z" fill="#FF8800" />
          <path d="M28 65 L72 65" stroke="#FFFFFF" stroke-width="8" />
          <path d="M38 40 L62 40" stroke="#FFFFFF" stroke-width="8" />
        </svg>
        <h2>PVP Player</h2>
      </div>
    </div>
    <div class="toggle-card">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">ENABLED</span>
      </div>
      <label class="switch" title="Toggle PVP Video Buttons">
        <input type="checkbox" id="toggle-btn" checked>
        <span class="slider round"></span>
      </label>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
